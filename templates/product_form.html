{% extends "base.html" %}
{% block title %}Cadastrar produto • Florê{% endblock %}
{% block content %}
<section class="panel formpanel"><h1>Cadastrar produto</h1><p>Preencha os dados para adicionar um item ao estoque.</p>
<form method="post" class="productform">
<label for="name">Nome do produto</label><input id="name" name="name" required>
<label for="category">Categoria</label><input id="category" name="category" required>
<label for="price">Preço (R$)</label><input id="price" name="price" type="number" min="0.01" step="0.01" required>
<label for="quantity">Quantidade disponível</label><input id="quantity" name="quantity" type="number" min="0" required>
<label for="minimum_quantity">Quantidade mínima para alerta</label><input id="minimum_quantity" name="minimum_quantity" type="number" min="0" value="5" required>
<div class="actions"><button type="submit">Salvar produto</button><a class="button secondary" href="{{ url_for('index') }}">Cancelar</a></div>
</form></section>
{% endblock %}
