
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Florê Cosméticos{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <div class="brand">Florê <span>Cosméticos</span></div>
  <p>Controle de estoque</p>
  <button type="button" id="contraste" aria-pressed="false">
    Ativar alto contraste
  </button>
</header>

<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="notice {{ category }}" role="status">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>

<footer>Projeto acadêmico • MVP Florê Cosméticos</footer>

<script>
  const botao = document.getElementById("contraste");

  botao.addEventListener("click", function () {
    const ativo = document.body.classList.toggle("alto-contraste");
    botao.setAttribute("aria-pressed", ativo);
    botao.textContent = ativo
      ? "Desativar alto contraste"
      : "Ativar alto contraste";
  });
</script>
</body>
</html>
